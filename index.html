<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
}

.app{
  max-width:500px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:25px;
  margin:25px 0;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 7px;
}

input{
  width:100%;
  padding:14px;
  font-size:18px;
  border:1px solid #ccc;
  border-radius:10px;
}

button{
  width:100%;
  padding:15px;
  margin-top:18px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.result{
  display:none;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="app">

<h1>Simple Calculator</h1>

<div class="card">

<label>মোট ইঞ্চি</label>

<input
id="inch"
type="number"
min="0"
step="1"
placeholder="যেমন: 40"
>

<label>সুতা</label>

<input
id="suta"
type="number"
min="0"
max="7.5"
step="0.5"
placeholder="যেমন: 4"
>

<button onclick="calculate()">
হিসাব করুন
</button>

<div id="result" class="result"></div>

</div>

</div>

<script>

function formatMeasurement(value){

  let inch = Math.floor(value);

  let suta = (value - inch) * 8;

  suta = Math.round(suta * 2) / 2;

  if(suta >= 8){
    inch++;
    suta = 0;
  }

  if(suta === 0){
    return inch + " ইঞ্চি";
  }

  return inch + " ইঞ্চি " + suta + " সুতা";
}


function calculate(){

  let inch =
    parseFloat(document.getElementById("inch").value) || 0;

  let suta =
    parseFloat(document.getElementById("suta").value) || 0;


  if(suta < 0 || suta >= 8){

    alert("সুতা ০ থেকে ৭.৫ এর মধ্যে দিন।");

    return;
  }


  // ৫ ইঞ্চি ৭ সুতা বাদ
  let cut = 5 + (7 / 8);

  let total = inch + (suta / 8);


  if(total <= cut){

    alert("মোট মাপ ৫ ইঞ্চি ৭ সুতার বেশি হতে হবে।");

    return;
  }


  // ৫ ইঞ্চি ৭ সুতা বাদ দিয়ে বাকি অংশ ২ ভাগ
  let half = (total - cut) / 2;


  document.getElementById("result").innerText =
    formatMeasurement(half);

  document.getElementById("result").style.display =
    "block";
}

</script>

</body>
</html>
